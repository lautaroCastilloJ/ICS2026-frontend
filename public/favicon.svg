<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Bolsa minimalista. Se invierte cuando el navegador usa tema oscuro. -->
  <style>
    .tile { fill: #1d1d1f; }
    .bag { stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #f5f5f7; }
      .bag { stroke: #000000; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="8" />
  <g class="bag" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.5 12.5h13l-1 11h-11z" />
    <path d="M12.75 12.5v-1.75a3.25 3.25 0 0 1 6.5 0v1.75" />
  </g>
</svg>
